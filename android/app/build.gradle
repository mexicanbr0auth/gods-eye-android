// Task para sincronizar o build web (dist) para assets
tasks.register("syncWebAssets", Copy) {
    def webDist = file("../../dist")
    def assetsDist = file("src/main/assets/dist")
    // Só copia se existir dist; caso contrário avisa
    onlyIf { webDist.exists() }
    from(webDist) {
        // Exclui sourcemaps grandes se quiser economizar APK
        // exclude "**/*.map"
    }
    into(assetsDist)
    doFirst {
        println("Sync web assets: ${webDist} -> ${assetsDist}")
        if (!webDist.exists()) {
            println("WARN: dist/ não encontrado. Rode 'npm run build' antes do gradle build.")
        } else {
            // limpa destino antes
            delete(assetsDist)
        }
    }
}

// Garante que sync roda antes de merge de assets
tasks.matching { it.name.contains("merge") && it.name.contains("Assets") }.configureEach {
    dependsOn("syncWebAssets")
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("syncWebAssets")
}
