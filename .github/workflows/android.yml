name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build web (ANDROID_BUILD=1 -> base ./)
        run: ANDROID_BUILD=1 npm run build
        env:
          # Chaves podem ser vazias no CI — app Android pedirá ao usuário em runtime
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - name: Sync to Android assets
        run: node scripts/sync-android-assets.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: android/app/src/main/assets/dist
          if-no-files-found: error

  build-apk:
    name: Build APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build web
        run: |
          npm ci
          ANDROID_BUILD=1 npm run build
          node scripts/sync-android-assets.mjs
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          # Fallback wrapper jar caso não exista gradlew — usa gradle direto
          ls -la android/ || true

      - name: Build Debug APK
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew -p android assembleDebug --stacktrace
          else
            gradle -p android assembleDebug --stacktrace
          fi

      - name: Build Release APK (unsigned)
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew -p android assembleRelease --stacktrace
          else
            gradle -p android assembleRelease --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Create Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: ./apks

      - uses: actions/download-artifact@v4
        with:
          name: apk-release-unsigned
          path: ./apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apks/**/*.apk
          generate_release_notes: true
