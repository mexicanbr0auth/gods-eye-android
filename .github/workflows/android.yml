name: Android Build (Native)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true; ls -la android/ || true

      - name: Build Debug APK (nativo)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew -p android assembleDebug --stacktrace
          else
            gradle -p android assembleDebug --stacktrace
          fi

      - name: Build Release APK (unsigned)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew -p android assembleRelease --stacktrace
          else
            gradle -p android assembleRelease --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-native
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-unsigned-native
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Create Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug-native
          path: ./apks
      - uses: actions/download-artifact@v4
        with:
          name: apk-release-unsigned-native
          path: ./apks
      - uses: softprops/action-gh-release@v2
        with:
          files: ./apks/**/*.apk
          generate_release_notes: true
